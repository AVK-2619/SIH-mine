<html>
    <title>Dashboard</title>
    <head>
        <script src="../JS/Dashboard.js"></script>
    </head>
    <body>
        <p id="Username"></p>
        <p id="CompanyName"></p>
        <p id="Age"></p>
        <p id="Qualification"></p>
        <p id="Skills"></p>
    </body>
    <script>
        const ResponseData = JSON.parse(localStorage.getItem("Data"));
        document.getElementById("Username").textContent = ResponseData.Username;
        document.getElementById("CompanyName").textContent = ResponseData.CompanyName;
        document.getElementById("Age").textContent = ResponseData.Age;
        document.getElementById("Qualification").textContent = ResponseData.Qualification;
        document.getElementById("Skills").textContent = ResponseData.Skills;
    </script>
</html>
